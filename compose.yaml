services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    env_file: .env.compose
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.0-trixie
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build: .
    env_file: .env.compose
    command: ["python", "-m", "opercerta.runtime.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build: .
    env_file: .env.compose
    environment:
      - OPERCERTA_EMBEDDING_CACHE_DIR=/home/opercerta/.cache/fastembed
    volumes:
      - fastembed_cache:/home/opercerta/.cache/fastembed
    command: ["python", "-m", "opercerta.runtime.mcp"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env.compose
    environment:
      OPERCERTA_REDIS_URL: ${OPERCERTA_REDIS_URL:-redis://redis:6379/0}
      OPERCERTA_CACHE_ENABLED: ${OPERCERTA_CACHE_ENABLED:-true}
      OPERCERTA_CACHE_TTL_SECONDS: ${OPERCERTA_CACHE_TTL_SECONDS:-60}
      OPERCERTA_TOOL_MODE: ${OPERCERTA_TOOL_MODE:-parallel}
      OPERCERTA_METRICS_ENABLED: ${OPERCERTA_METRICS_ENABLED:-false}
    command: ["python", "-m", "opercerta.runtime.api"]
    ports:
      - "${OPERCERTA_API_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      mcp:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  fastembed_cache:
